name: publish

# Publishes to PyPI when a version tag is pushed, e.g. `git tag v0.1.0 &&
# git push origin v0.1.0`. Nothing else triggers it.
#
# It uses PyPI's Trusted Publishing: PyPI accepts the upload because it comes
# from this workflow in this repository, run in the `pypi` environment. No
# token or password is stored anywhere. The trusted publisher has to be
# configured on PyPI first (see docs/releasing.md).

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: The tag must be the version in pyproject.toml
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match version ${version} in pyproject.toml"
            exit 1
          fi
      - run: python -m pip install build twine pytest cryptography
      - name: Tests
        run: python -m pytest -q
      - name: Build the sdist and the wheel
        run: python -m build
      - name: Check the metadata
        run: python -m twine check --strict dist/*
      - name: Install the wheel in a new environment and run its command
        run: |
          python -m venv /tmp/check
          /tmp/check/bin/pip install dist/*.whl
          cd /tmp && /tmp/check/bin/actasum --help
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/actasum/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
