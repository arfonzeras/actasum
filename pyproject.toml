[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "actasum"
version = "0.1.0"
description = "Open format and verifier for polling-station tally sheets"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "arfonzeras" }]
keywords = ["elections", "tally sheets", "verification", "transparency log", "merkle tree"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Sociology",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = []

[project.optional-dependencies]
# Only needed to sign checkpoints, run a witness or check signatures.
sign = ["cryptography>=42"]

[project.urls]
Homepage = "https://github.com/arfonzeras/actasum"
Source = "https://github.com/arfonzeras/actasum"
Issues = "https://github.com/arfonzeras/actasum/issues"
Documentation = "https://github.com/arfonzeras/actasum/tree/main/docs"

[project.scripts]
actasum = "actasum.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
