[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tallylog"
version = "0.1.0"
description = "Open format and verifier for polling-station tally sheets"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = []

[project.optional-dependencies]
# Only needed to sign checkpoints, run a witness or check signatures.
sign = ["cryptography>=42"]

[project.scripts]
tallylog = "tallylog.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
